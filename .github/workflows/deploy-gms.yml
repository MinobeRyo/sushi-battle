name: Build and deploy to GMS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      operation:
        description: 'check: 接続確認のみ / deploy: 転送と再起動'
        required: true
        default: check
        type: choice
        options:
          - check
          - deploy

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Check game rules and online play
        run: |
          npm test
          node --test scripts/test-auto-merge.mjs
          npm run typecheck:server
          npm run typecheck:worker
          npm run test:online
          php -l deploy/gms/api.php
          node --import tsx scripts/test-php-bridge.mjs
          npm run lint
      - name: Test deployment and recovery locally
        run: |
          mkdir -p .cache/deploy-runtime
          cp deploy/gms-server/package.json deploy/gms-server/package-lock.json .cache/deploy-runtime/
          npm ci --omit=dev --prefix .cache/deploy-runtime \
            --cache "$GITHUB_WORKSPACE/.cache/npm-server-package" --no-audit --no-fund
          node deploy/gms/test-deploy.cjs
      - name: Build upload package
        run: |
          node scripts/package-gms.mjs
          tar -czf "$RUNNER_TEMP/sushi-battle-release.tgz" -C release/gms \
            sushi-battle sushi-battle-server deploy.sh deploy.cjs ecosystem.config.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gms-release
          path: ${{ runner.temp }}/sushi-battle-release.tgz
          if-no-files-found: error
          retention-days: 7

  check:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.operation == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: gms
      url: https://gms.gdl.jp/~ryom13/sushi-battle/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check deployment prerequisites and diagnose the current game
        id: prerequisites
        env:
          GMS_SSH_KEY: ${{ secrets.GMS_SSH_KEY }}
          GMS_KNOWN_HOSTS: ${{ secrets.GMS_KNOWN_HOSTS }}
        run: bash deploy/gms/check-connection.sh
      - name: Report preparation and current public PHP status separately
        env:
          BACKEND_OK: ${{ steps.prerequisites.outputs.backend_ok }}
        shell: bash
        run: |
          status=$(curl --silent --show-error --max-time 15 --output "$RUNNER_TEMP/gms-check-api-response" \
            --write-out '%{http_code}' 'https://gms.gdl.jp/~ryom13/sushi-battle/api.php') || status=000
          api_ok=false
          if [[ "$status" == 200 ]] && jq -e '.ok == true and .transport == "php-polling"' "$RUNNER_TEMP/gms-check-api-response" >/dev/null 2>&1; then
            api_ok=true
          fi
          printf '### GMS 配布準備の確認\n\n**配布準備の確認は成功しました。** SSH、Node.js、npm、配置先の書き込み権限を確認しました。\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BACKEND_OK" == true ]]; then
            printf -- '- 現在の対戦サーバー: 正常な応答を確認しました。\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf -- '- 現在の対戦サーバー: 稼働確認未完了です。停止中、または期待する応答がありません。\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$api_ok" == true ]]; then
            printf -- '- 現在の公開PHP: 対戦サーバーへの接続を確認しました。\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf -- '- 現在の公開PHP: 接続確認未完了です（HTTP %s、または期待する応答がありません）。\n' "$status" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$BACKEND_OK" != true || "$api_ok" != true ]]; then
            printf '\n**ゲームの稼働確認は未完了です。** 手動サーバーを停止済みでも配布準備の失敗にはなりません。deploy は新版を起動し、起動結果を検証します。\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\nファイルの転送・サーバーの停止・再起動は行っていません。この確認では実際の2人対戦を検証していません。\n\n初回の切り替えでは、手動サーバーがまだ動いていれば Ctrl+C で止めてから、operation に deploy を選んで実行してください。停止済みなら、そのまま deploy に進めます。\n' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy') ||
       (github.event_name == 'push' && vars.GMS_AUTO_DEPLOY == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gms-production
      cancel-in-progress: false
    environment:
      name: gms
      url: https://gms.gdl.jp/~ryom13/sushi-battle/
    steps:
      - name: Skip an outdated main build
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current_sha=$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            printf 'deploy=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'deploy=false\n' >> "$GITHUB_OUTPUT"
            printf 'Skipped this build because main has a newer commit.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.current.outputs.deploy == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.current.outputs.deploy == 'true'
        with:
          name: gms-release
          path: .cache/gms-artifact
      - name: Upload and restart the game
        if: steps.current.outputs.deploy == 'true'
        env:
          GMS_SSH_KEY: ${{ secrets.GMS_SSH_KEY }}
          GMS_KNOWN_HOSTS: ${{ secrets.GMS_KNOWN_HOSTS }}
          GMS_DEPLOY_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/gms/upload.sh .cache/gms-artifact/sushi-battle-release.tgz
      - name: Report public connection status
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          printf '### GMS deploy\n\nFile transfer and server startup completed.\n\n' >> "$GITHUB_STEP_SUMMARY"
          status=$(curl --silent --show-error --max-time 15 --output "$RUNNER_TEMP/gms-api-response" \
            --write-out '%{http_code}' 'https://gms.gdl.jp/~ryom13/sushi-battle/api.php') || status=000
          if [[ "$status" == 200 ]] && jq -e '.ok == true and .transport == "php-polling"' "$RUNNER_TEMP/gms-api-response" >/dev/null 2>&1; then
            printf 'The public PHP endpoint reached the game server.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'The public PHP endpoint is not ready (HTTP %s). Check api.php placement and the game server.\n' "$status" >> "$GITHUB_STEP_SUMMARY"
            printf '::warning::File transfer and startup succeeded, but the public PHP endpoint is not ready (HTTP %s).\n' "$status"
          fi
