name: Merge verified pull requests

on:
  workflow_run:
    workflows: [Build and deploy to GMS]
    types: [completed]

permissions: {}

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # workflow_run uses the default branch. Never check out or run PR code here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Merge the verified PR and continue deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GMS_AUTO_DEPLOY: ${{ vars.GMS_AUTO_DEPLOY }}
        run: node scripts/auto-merge-pr.mjs
